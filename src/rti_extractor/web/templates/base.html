<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RTI Extractor{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f6f4; --card: #fff; --ink: #1a1a18; --muted: #6b6b66;
      --line: #dcdcd6; --accent: #2f6f4e; --warn: #8a5a12; --danger: #a33;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 32px 20px; background: var(--bg); color: var(--ink);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .wrap { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; }
    h2 { font-size: 17px; font-weight: 600; margin: 0 0 12px; }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 28px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      padding: 20px; margin-bottom: 16px;
    }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    input[type=text], input[type=number], select, textarea {
      width: 100%; padding: 8px 10px; font: inherit; font-size: 15px;
      border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink);
    }
    textarea { min-height: 70px; resize: vertical; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .full { grid-column: 1 / -1; }
    button {
      font: inherit; font-size: 15px; font-weight: 500; padding: 11px 22px;
      background: var(--accent); color: #fff; border: 0; border-radius: 7px; cursor: pointer;
    }
    button:disabled { background: var(--muted); cursor: wait; }
    .evidence {
      margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line);
      font-size: 13px; color: var(--muted);
    }
    .evidence blockquote {
      margin: 6px 0 0; padding-left: 12px; border-left: 3px solid var(--line);
      white-space: pre-wrap; color: var(--ink); font-size: 13px;
    }
    .pill {
      display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 12px;
      background: #eceae4; color: var(--muted); margin-right: 6px;
    }
    .banner {
      background: #fff8e6; border: 1px solid #e8d9a8; color: var(--warn);
      padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 20px;
    }
    a { color: var(--accent); }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    {% block body %}{% endblock %}
  </div>
</body>
</html>
